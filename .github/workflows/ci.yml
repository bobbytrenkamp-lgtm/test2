name: CI

# ---------------------------------------------------------------------------
# Zero-cost policy (see docs/zero-cost-operation.md).
#
# This repository is public, and GitHub Actions is free without limit on
# GitHub-hosted standard runners for public repositories. The settings below
# are nonetheless written so that this workflow stays inside the free
# allowance if the repository is ever made private, where minutes are metered:
#
#   * `push` is limited to the default branch. Work on a feature branch is
#     verified once, by the pull_request trigger. Previously this ran on every
#     branch AND on pull requests, which double-billed every push to an open PR.
#   * `concurrency` cancels superseded runs, so a rapid series of pushes costs
#     one run rather than one per push.
#   * `timeout-minutes` caps a hung job. Without it the default ceiling is six
#     hours, which is the single largest way a metered account leaks minutes.
#   * Only `ubuntu-latest` is used. Windows bills at 2x and macOS at 10x.
#   * Only free, official container images are used.
#   * Every check runs in one job. A second job would repeat the checkout, the
#     dependency install and the browser download, which is the cost that
#     matters — not the checks themselves.
#   * Failed end-to-end traces and the HTML report stay on the runner rather
#     than being uploaded as artifacts, because artifact storage is metered on
#     a private repository. Failures print the rule, the element and the page.
#
# Do not add a scheduled (`cron`) trigger. A schedule bills whether or not
# anything changed, and is the other common way a free allowance is consumed.
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
  pull_request:
  # Allows a manual run without adding a recurring scheduled cost.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # A full run takes roughly two minutes; 20 is generous headroom and still
    # bounds the cost of a hang.
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cre
          POSTGRES_PASSWORD: cre
          POSTGRES_DB: cre_platform_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cre -d cre_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://cre:cre@localhost:5432/cre_platform_test
      SESSION_SECRET: ci-session-secret-long-enough-to-satisfy-validation

    steps:
      - uses: actions/checkout@v4

      # No `version` here on purpose: the action reads `packageManager` from
      # package.json, and specifying both is an error. Keeping it in one place
      # also means CI and a developer's machine cannot drift apart on the
      # pnpm version.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

      # Chromium only. Firefox and WebKit would triple the download and the run
      # time for coverage the end-to-end suite does not currently claim; see
      # docs/testing-strategy.md. The browser is a free download from
      # Playwright's own CDN and no account or key is involved. Installed
      # before `pnpm test`, not just before the end-to-end suite below,
      # because the worker's server-side PDF rendering (apps/worker/src/pdf.ts)
      # launches this same browser and is exercised by a `pnpm test` unit test.
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm db:migrate

      # Engine, import, authorization and vertical-slice suites. The
      # database-backed suites run for real; they do not skip in CI.
      - run: pnpm test

      - name: Build the web client
        run: pnpm --filter @cre/web run build

      # Drives the built bundle in a real browser against a real API and
      # database, and runs the axe accessibility checks. `pnpm test:e2e`
      # rebuilds the end-to-end database from the migrations and the seed
      # before it starts, so the run does not depend on the suites above.
      - name: End-to-end and accessibility tests
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgres://cre:cre@localhost:5432/cre_platform_e2e

      # Times the engine on four synthetic models and fails if any exceeds its
      # budget. The budgets are loose on purpose — they catch an
      # order-of-magnitude regression, not the few percent of noise a shared
      # runner produces.
      - name: Performance baseline
        run: pnpm benchmark

      # Builds a thousand-property organization in a scratch database and times
      # the queries the interface actually issues. The engine benchmark above
      # measures arithmetic; this measures what happens when the tables are
      # large, which is a different failure mode.
      - name: Database load test
        run: pnpm load-test

      # Drives the real server through parallel clients and fails on any error
      # or an out-of-budget tail. Fewer clients than the local run: a shared
      # runner has less CPU, and this checks for failures and deadlocks rather
      # than chasing a throughput number that would not be portable anyway.
      - name: Concurrency test
        run: pnpm concurrency-test
        env:
          CONCURRENCY: 50
          ROUNDS: 4

      # Backs the database up, restores it into a scratch database, and checks
      # that a stored valuation still reproduces from the restored data. A
      # backup nobody restores is a hope, not a backup; running it here means
      # the procedure cannot rot unnoticed.
      - name: Backup and restore drill
        run: pnpm db:seed && pnpm drill:restore

      # Fails the build on a high or critical vulnerability. Moderate findings
      # are still visible in the job log but do not block: react-router-dom's
      # three moderate open-redirect/XSS advisories are only patched in its
      # v7 line, a real routing-API migration, not a version bump, and
      # exceljs's transitive uuid dependency (moderate, a buffer-bounds check
      # exceljs's own v4 usage never triggers) is tracked for exceljs's next
      # major release. Both are recorded here rather than silently ignored.
      - name: Dependency audit
        run: pnpm audit --audit-level=high

      # Fails the build if a dependency arrives under a licence that would
      # require a commercial licence for this project's use. Runs offline
      # against the installed tree; it contacts no external service.
      - name: Licence check
        run: node scripts/check-licences.mjs

      # The deployment guide's rollback procedure assumes every migration leaves
      # the previous release able to run. That was a policy with nothing
      # enforcing it; this is the enforcement. Reads files only.
      - name: Migration rollback safety
        run: node scripts/check-migrations.mjs

      # The test counts in the documentation went stale repeatedly, which made
      # the rest of those documents harder to trust. This enumerates the suites
      # without running them and fails if a stated figure is wrong. It runs
      # after the suites so a genuine test failure is reported first — a
      # doc-count mismatch is the less interesting of the two.
      - name: Documentation matches the code
        run: node scripts/check-docs.mjs
