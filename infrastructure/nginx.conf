server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # The client and API share one origin, so the session cookie is first-party
  # and SameSite=Lax behaves as intended.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;
  }

  # Hashed asset filenames are safe to cache indefinitely.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Single-page application: unknown paths return the shell, not a 404.
  location / {
    try_files $uri $uri/ /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
  }
}
