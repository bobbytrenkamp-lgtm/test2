# Local development stack.
#
# VERIFICATION STATUS, precisely:
#   * `docker compose config` parses and validates this file — done, passes.
#   * The base images now pull and the Docker daemon itself runs in the
#     environment this was developed in — both untrue in an earlier revision
#     of this comment. What changed: the images are fetched from
#     mirror.gcr.io rather than docker.io (see the comment at the top of
#     Dockerfile.api). `node:22-alpine`, `nginx:1.27-alpine`,
#     `postgres:16-alpine` and `clamav/clamav:1.4_base` — every image this
#     stack needs — were pulled successfully and in full by hand from that
#     mirror. `docker.io` itself is reachable for manifests but its blob CDN
#     (`production.cloudfront.docker.com`) is not: that is still the reason
#     a plain `node:22-alpine` reference cannot be pulled here, not a claim
#     that no image anywhere is reachable.
#   * `docker compose build` still does not complete in this environment, for
#     a different and more specific reason: this development environment's
#     own network policy transparently intercepts outbound HTTPS through a
#     proxy the build container does not trust by default, so `RUN pnpm
#     install` and `RUN apk add` both fail TLS verification before they ever
#     reach the question of what they are fetching. Diagnosed by hand,
#     outside the committed Dockerfile, by trusting that proxy's certificate
#     for one throwaway build: once trusted, `pnpm install --frozen-lockfile`
#     for the full workspace succeeds cleanly in the container — that layer
#     of the Dockerfile is confirmed correct. `apk add chromium` still fails
#     past that point, because Alpine's own package CDN
#     (`dl-cdn.alpinelinux.org`, and every mirror tried) is itself blocked by
#     this same policy, independent of the TLS-trust issue. Trusting this
#     environment's own interception proxy is not something that belongs in
#     the committed Dockerfile — it is a fact about this sandbox, not about
#     any real deployment, and baking it into the image would misrepresent
#     what the image trusts. So the build stays genuinely unverified end to
#     end here; what narrowed is exactly which single step blocks it.
#   * The `clamav` service is additionally unverified in its own right even
#     past an image pull: this same network policy also blocks
#     database.clamav.net, which `freshclam` needs to load virus definitions
#     at container startup (see the comment on the `clamav` service below).
#     Its wire protocol against the api's `clamscan` client has not been
#     exercised against a live daemon anywhere in this environment.
#   * The rendering code the blocked `apk add chromium` step exists to serve
#     is verified independent of it — `apps/worker/src/pdf.test.ts` produces
#     real PDF bytes from a real headless Chromium already installed in this
#     environment for Playwright's own use — only the Alpine packaging step
#     is unbuilt.
#
# Local development on a directly installed PostgreSQL 16 is verified, as is the
# backup and restore drill (`pnpm drill:restore`). See docs/deployment-guide.md.

services:
  postgres:
    # mirror.gcr.io, not docker.io — see the comment at the top of
    # Dockerfile.api. Same official image.
    image: mirror.gcr.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: cre
      POSTGRES_PASSWORD: cre
      POSTGRES_DB: cre_platform
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cre -d cre_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment:
      # Not `production`: the Dockerfile bakes NODE_ENV=production as the
      # image's own default for a real deployment, but this stack runs over
      # plain HTTP with a hardcoded secret, so SESSION_COOKIE_SECURE below is
      # `false` — a combination the API's own startup validation refuses
      # under `production`, on purpose, so a real deployment cannot come up
      # misconfigured. Overriding it here is what makes local development
      # over HTTP possible without weakening that check for anyone else.
      NODE_ENV: development
      DATABASE_URL: postgres://cre:cre@postgres:5432/cre_platform
      API_PORT: '4000'
      WEB_ORIGIN: http://localhost:8080
      # Development-only value. Generate a real secret for any deployment.
      SESSION_SECRET: local-development-secret-not-for-any-real-deployment
      SESSION_COOKIE_SECURE: 'false'
      # `clamav` below is a sibling service, not a hard dependency: SCAN_DRIVER
      # defaults to `none`, so this stack runs with nothing scanned unless you
      # opt in. To scan uploads, set SCAN_DRIVER=clamav here (and on `worker`,
      # if it ever handles uploads) and move `clamav` into this service's
      # `depends_on`. SCAN_HOST/SCAN_PORT already point at the sibling service
      # by name, so no further change is needed once the driver is switched on.
      SCAN_DRIVER: 'none'
      SCAN_HOST: clamav
      SCAN_PORT: '3310'
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['4000:4000']
    command: >
      sh -c "pnpm --filter @cre/database run migrate &&
             pnpm --filter @cre/api run start"

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment:
      # See the comment on the `api` service's own NODE_ENV above.
      NODE_ENV: development
      DATABASE_URL: postgres://cre:cre@postgres:5432/cre_platform
      SESSION_SECRET: local-development-secret-not-for-any-real-deployment
    depends_on:
      postgres: { condition: service_healthy }
    command: ['pnpm', '--filter', '@cre/worker', 'run', 'start']

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    depends_on: [api]
    ports: ['8080:80']

  # Optional. Free and open source, like everything else this stack runs
  # itself — no paid scanning API involved. Not in any other service's
  # `depends_on` by default because SCAN_DRIVER defaults to `none`; see the
  # comment on `api`'s environment above for how to switch scanning on.
  # `freshclam` (this image's virus-definition updater) needs to reach
  # database.clamav.net at startup — a network policy that blocks it will
  # leave `clamd` running with no definitions loaded, which the api's own
  # ScannerUnavailableError does not detect (`clamd` is still reachable; it
  # just never finds anything). That is an operational concern for whoever
  # runs this service, not something client code can verify from the outside.
  clamav:
    # mirror.gcr.io mirrors this too, not only the `library/*` official
    # images — see the comment at the top of Dockerfile.api.
    image: mirror.gcr.io/clamav/clamav:1.4_base
    ports: ['3310:3310']
    volumes: ['clamav-data:/var/lib/clamav']
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres-data:
  clamav-data:
