# Local development stack.
#
# VERIFICATION STATUS, precisely:
#   * `docker compose config` parses and validates this file — done, passes.
#   * The images have still never been built. The environment this was developed
#     in reaches the Docker daemon but its network policy blocks Docker Hub's
#     blob CDN, so `node:22-alpine`, `nginx:1.27-alpine`, `postgres:16-alpine`
#     and `clamav/clamav:1.4_base` cannot be pulled. Several defects found by
#     reading these files have been fixed (see git history), but a review is
#     not a build. Treat the images as unbuilt until someone runs
#     `docker compose build` on a machine that can reach the registry.
#   * The `clamav` service is additionally unverified in its own right even
#     past the image pull: this same network policy also blocks
#     database.clamav.net, which `freshclam` needs to load virus definitions
#     at container startup (see the comment on the `clamav` service below).
#     Its wire protocol against the api's `clamscan` client has not been
#     exercised against a live daemon anywhere in this environment.
#   * `Dockerfile.api`'s `apk add chromium` step (for the worker's
#     server-side PDF rendering, apps/worker/src/pdf.ts) is likewise
#     unverified past a build this environment cannot run: this development
#     environment is Ubuntu, not Alpine, so `apk` itself is not available
#     here to confirm the package name or that CHROMIUM_EXECUTABLE_PATH
#     (/usr/bin/chromium-browser) is where it lands. The rendering code
#     itself is verified — `apps/worker/src/pdf.test.ts` produces real PDF
#     bytes from a real headless Chromium already installed in this
#     environment for Playwright's own use — only the Alpine packaging step
#     is unbuilt.
#
# Local development on a directly installed PostgreSQL 16 is verified, as is the
# backup and restore drill (`pnpm drill:restore`). See docs/deployment-guide.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cre
      POSTGRES_PASSWORD: cre
      POSTGRES_DB: cre_platform
    ports: ['5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cre -d cre_platform']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cre:cre@postgres:5432/cre_platform
      API_PORT: '4000'
      WEB_ORIGIN: http://localhost:8080
      # Development-only value. Generate a real secret for any deployment.
      SESSION_SECRET: local-development-secret-not-for-any-real-deployment
      SESSION_COOKIE_SECURE: 'false'
      # `clamav` below is a sibling service, not a hard dependency: SCAN_DRIVER
      # defaults to `none`, so this stack runs with nothing scanned unless you
      # opt in. To scan uploads, set SCAN_DRIVER=clamav here (and on `worker`,
      # if it ever handles uploads) and move `clamav` into this service's
      # `depends_on`. SCAN_HOST/SCAN_PORT already point at the sibling service
      # by name, so no further change is needed once the driver is switched on.
      SCAN_DRIVER: 'none'
      SCAN_HOST: clamav
      SCAN_PORT: '3310'
    depends_on:
      postgres: { condition: service_healthy }
    ports: ['4000:4000']
    command: >
      sh -c "pnpm --filter @cre/database run migrate &&
             pnpm --filter @cre/api run start"

  worker:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.api
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cre:cre@postgres:5432/cre_platform
      SESSION_SECRET: local-development-secret-not-for-any-real-deployment
    depends_on:
      postgres: { condition: service_healthy }
    command: ['pnpm', '--filter', '@cre/worker', 'run', 'start']

  web:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web
    depends_on: [api]
    ports: ['8080:80']

  # Optional. Free and open source, like everything else this stack runs
  # itself — no paid scanning API involved. Not in any other service's
  # `depends_on` by default because SCAN_DRIVER defaults to `none`; see the
  # comment on `api`'s environment above for how to switch scanning on.
  # `freshclam` (this image's virus-definition updater) needs to reach
  # database.clamav.net at startup — a network policy that blocks it will
  # leave `clamd` running with no definitions loaded, which the api's own
  # ScannerUnavailableError does not detect (`clamd` is still reachable; it
  # just never finds anything). That is an operational concern for whoever
  # runs this service, not something client code can verify from the outside.
  clamav:
    image: clamav/clamav:1.4_base
    ports: ['3310:3310']
    volumes: ['clamav-data:/var/lib/clamav']
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres-data:
  clamav-data:
